name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # Installs with the public sibling commits named in source-siblings.json
      # (@bearly/cli-process, not yet on npm) in place of their npm releases,
      # retrying the install 3x, then restores package.json and bun.lock byte
      # for byte (hh 27071).
      - uses: ./.github/actions/source-siblings
      - run: bun run check
      - run: bun run test:stress
